<!DOCTYPE html>
<html lang="he">
<head>
    <meta charset="UTF-8">
    <title>דף חסימה</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f5f5f5;
            font-family: Arial, sans-serif;
            text-align: center;
        }
        .box {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>הגישה לאתר נחסמה</h1>
        <p>אתר זה אינו זמין לפי הגדרות הסינון.</p>
    </div>
</body>
</html>
